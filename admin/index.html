<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – Thiện Nga</title>
  <style>
    :root {
      --blue: #0f5a2c;
      --blue-2: #174b35;
      --gold: #f1cf73;
      --bg: #f5f7f2;
      --card: #ffffff;
      --text: #173322;
      --muted: #657668;
      --line: #dfe9e0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
    .top h1 { margin: 0; font-size: 26px; color: var(--blue-2); }
    .tag { background: #eaf4ec; color: var(--blue); border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800; }
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .tab { border: 1px solid var(--line); background: #fff; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 800; }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 8px 24px rgba(15, 90, 44, 0.08); }
    .panel.hidden { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 800; color: var(--blue-2); }
    .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .field textarea { min-height: 80px; resize: vertical; }
    .btn { border: none; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 900; cursor: pointer; background: var(--blue); color: #fff; }
    .btn.secondary { background: #2f9d55; }
    .btn.danger { background: #a33a38; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: top; }
    th { background: #f8faf8; color: var(--blue-2); }
    .small { color: var(--muted); font-size: 12px; }
    .status { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 900; }
    .status.pending { background: #fff6db; color: #8d6212; }
    .status.success { background: #e4f7e8; color: #0b6f2f; }
    .muted { color: var(--muted); }
    @media (max-width: 700px) { .top { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Admin Panel – CRM Thiện Nga</h1>
        <div class="small">Demo nhanh: quản lý sản phẩm, khách hàng và đơn hàng — không cần đăng nhập.</div>
      </div>
      <div class="tag">Local demo</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="products">Sản phẩm</button>
      <button class="tab" data-tab="customers">Khách hàng</button>
      <button class="tab" data-tab="orders">Đơn hàng</button>
    </div>

    <section class="panel" id="productsPanel">
      <div class="grid">
        <div class="field">
          <label>Tên sản phẩm</label>
          <input id="pName" type="text" placeholder="Ví dụ: Checklist Tiệc Cưới" />
        </div>
        <div class="field">
          <label>Loại</label>
          <select id="pType">
            <option value="digital">digital</option>
            <option value="physical">physical</option>
            <option value="service">service</option>
          </select>
        </div>
        <div class="field">
          <label>Giá</label>
          <input id="pPrice" type="number" placeholder="200000" />
        </div>
        <div class="field">
          <label>Số lượng còn lại</label>
          <input id="pStock" type="number" placeholder="Để trống nếu không cần" />
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Mô tả</label>
          <textarea id="pDesc" placeholder="Mô tả ngắn về sản phẩm..."></textarea>
        </div>
      </div>
      <button class="btn" onclick="saveProduct()">Thêm sản phẩm</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tên</th><th>Loại</th><th>Giá</th><th>Tồn kho</th><th>Mô tả</th><th>Hành động</th>
            </tr>
          </thead>
          <tbody id="productsTable"></tbody>
        </table>
      </div>
    </section>

    <section class="panel hidden" id="customersPanel">
      <div class="grid">
        <div class="field">
          <label>Họ tên</label>
          <input id="cName" type="text" placeholder="Tên khách hàng" />
        </div>
        <div class="field">
          <label>Số điện thoại</label>
          <input id="cPhone" type="tel" placeholder="09..." />
        </div>
        <div class="field">
          <label>Zalo</label>
          <input id="cZalo" type="text" placeholder="Zalo" />
        </div>
        <div class="field">
          <label>Ngày đăng ký</label>
          <input id="cDate" type="date" />
        </div>
      </div>
      <button class="btn secondary" onclick="saveCustomer()">Thêm khách hàng</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Họ tên</th><th>SĐT</th><th>Zalo</th><th>Ngày đăng ký</th><th>Hành động</th></tr>
          </thead>
          <tbody id="customersTable"></tbody>
        </table>
      </div>
    </section>

    <section class="panel hidden" id="ordersPanel">
      <div class="grid">
        <div class="field">
          <label>Khách hàng</label>
          <select id="oCustomer"></select>
        </div>
        <div class="field">
          <label>Sản phẩm</label>
          <select id="oProduct"></select>
        </div>
        <div class="field">
          <label>Số tiền</label>
          <input id="oAmount" type="number" placeholder="200000" />
        </div>
        <div class="field">
          <label>Trạng thái</label>
          <select id="oStatus">
            <option value="pending">pending</option>
            <option value="success">success</option>
          </select>
        </div>
        <div class="field">
          <label>Ngày mua</label>
          <input id="oDate" type="date" />
        </div>
      </div>
      <button class="btn" onclick="saveOrder()">Thêm đơn hàng</button>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Khách</th><th>Sản phẩm</th><th>Số tiền</th><th>Trạng thái</th><th>Ngày</th><th>Hành động</th></tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
  <script>
    const STORAGE = {
      sqliteDb: 'tn_admin_sqlite_db'
    };

    let SQL;
    let db;

    function fmtMoney(n) {
      return Number(n || 0).toLocaleString('vi-VN') + 'đ';
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function persistDb() {
      const data = db.export();
      const binary = Array.from(data).map(byte => String.fromCharCode(byte)).join('');
      localStorage.setItem(STORAGE.sqliteDb, btoa(binary));
    }

    function loadDb() {
      const raw = localStorage.getItem(STORAGE.sqliteDb);
      if (!raw) {
        db = new SQL.Database();
        return;
      }
      const bytes = Uint8Array.from(atob(raw), c => c.charCodeAt(0));
      db = new SQL.Database(bytes);
    }

    function ensureSchema() {
      db.run(`CREATE TABLE IF NOT EXISTS products (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT NOT NULL,
        type TEXT,
        price REAL,
        description TEXT,
        stock INTEGER
      )`);

      db.run(`CREATE TABLE IF NOT EXISTS customers (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT NOT NULL,
        phone TEXT NOT NULL,
        zalo TEXT,
        registered_at TEXT
      )`);

      db.run(`CREATE TABLE IF NOT EXISTS orders (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        customer_id INTEGER NOT NULL,
        product_id INTEGER NOT NULL,
        amount REAL,
        status TEXT,
        purchased_at TEXT
      )`);
    }

    function seedIfEmpty() {
      const rows = db.exec('SELECT COUNT(*) AS cnt FROM products');
      const count = Number(rows[0]?.values?.[0]?.[0] || 0);
      if (count > 0) return;

      db.run(`INSERT INTO products (name, type, price, description, stock) VALUES
        ('Checklist Tiệc Cưới', 'digital', 199000, 'Checklist chuẩn bị tiệc, viết gọn, dễ dùng.', NULL),
        ('Set Menu Cưới', 'service', 2200000, 'Gói tư vấn menu cho tiệc cưới.', NULL),
        ('Bàn ghế tiệc', 'physical', 1200000, 'Bàn ghế cho sự kiện gia đình.', 20)`);

      db.run(`INSERT INTO customers (name, phone, zalo, registered_at) VALUES
        ('Nguyễn Văn A', '0900000000', '0900000000', '2026-08-01'),
        ('Trần Thị B', '0911111111', '0911111111', '2026-08-01')`);

      db.run(`INSERT INTO orders (customer_id, product_id, amount, status, purchased_at) VALUES
        (1, 1, 199000, 'pending', '2026-08-01'),
        (2, 2, 2200000, 'success', '2026-08-01')`);
    }

    function fetchProductRows() {
      return db.exec(`SELECT id, name, type, price, description, stock FROM products ORDER BY id`)[0]?.values || [];
    }

    function fetchCustomerRows() {
      return db.exec(`SELECT id, name, phone, zalo, registered_at FROM customers ORDER BY id`)[0]?.values || [];
    }

    function fetchOrderRows() {
      return db.exec(`SELECT o.id, c.name AS customer_name, p.name AS product_name, o.amount, o.status, o.purchased_at
        FROM orders o
        LEFT JOIN customers c ON c.id = o.customer_id
        LEFT JOIN products p ON p.id = o.product_id
        ORDER BY o.id`)[0]?.values || [];
    }

    function renderProducts() {
      const tbody = document.getElementById('productsTable');
      const rows = fetchProductRows();
      tbody.innerHTML = rows.map(row => {
        const [id, name, type, price, description, stock] = row;
        return `
          <tr>
            <td><b>${escapeHtml(name)}</b></td>
            <td>${escapeHtml(type)}</td>
            <td>${fmtMoney(price)}</td>
            <td>${stock == null ? '—' : stock}</td>
            <td>${escapeHtml(description || '')}</td>
            <td><button class="btn danger" onclick="deleteProduct(${id})">Xóa</button></td>
          </tr>`;
      }).join('');

      const select = document.getElementById('oProduct');
      select.innerHTML = rows.map(row => `<option value="${row[0]}">${escapeHtml(row[1])}</option>`).join('');
    }

    function renderCustomers() {
      const tbody = document.getElementById('customersTable');
      const rows = fetchCustomerRows();
      tbody.innerHTML = rows.map(row => {
        const [id, name, phone, zalo, registeredAt] = row;
        return `
          <tr>
            <td>${escapeHtml(name)}</td>
            <td>${escapeHtml(phone)}</td>
            <td>${escapeHtml(zalo || '')}</td>
            <td>${escapeHtml(registeredAt || '')}</td>
            <td><button class="btn danger" onclick="deleteCustomer(${id})">Xóa</button></td>
          </tr>`;
      }).join('');

      const select = document.getElementById('oCustomer');
      select.innerHTML = rows.map(row => `<option value="${row[0]}">${escapeHtml(row[1])}</option>`).join('');
    }

    function renderOrders() {
      const tbody = document.getElementById('ordersTable');
      const rows = fetchOrderRows();
      tbody.innerHTML = rows.map(row => {
        const [id, customerName, productName, amount, status, purchasedAt] = row;
        return `
          <tr>
            <td>${escapeHtml(customerName || '-')}</td>
            <td>${escapeHtml(productName || '-')}</td>
            <td>${fmtMoney(amount)}</td>
            <td><span class="status ${status}">${escapeHtml(status)}</span></td>
            <td>${escapeHtml(purchasedAt || '')}</td>
            <td><button class="btn danger" onclick="deleteOrder(${id})">Xóa</button></td>
          </tr>`;
      }).join('');
    }

    function saveProduct() {
      const name = document.getElementById('pName').value.trim();
      const type = document.getElementById('pType').value;
      const price = Number(document.getElementById('pPrice').value || 0);
      const stock = document.getElementById('pStock').value === '' ? null : Number(document.getElementById('pStock').value);
      const description = document.getElementById('pDesc').value.trim();
      if (!name) return alert('Vui lòng nhập tên sản phẩm');

      db.run('INSERT INTO products (name, type, price, description, stock) VALUES (?, ?, ?, ?, ?)', [name, type, price, description, stock]);
      persistDb();
      renderAll();
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pStock').value = '';
      document.getElementById('pDesc').value = '';
    }

    function saveCustomer() {
      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const zalo = document.getElementById('cZalo').value.trim();
      const registeredAt = document.getElementById('cDate').value || new Date().toISOString().slice(0, 10);
      if (!name || !phone) return alert('Tên và số điện thoại là bắt buộc');

      db.run('INSERT INTO customers (name, phone, zalo, registered_at) VALUES (?, ?, ?, ?)', [name, phone, zalo, registeredAt]);
      persistDb();
      renderAll();
      document.getElementById('cName').value = '';
      document.getElementById('cPhone').value = '';
      document.getElementById('cZalo').value = '';
      document.getElementById('cDate').value = '';
    }

    function saveOrder() {
      const customerId = Number(document.getElementById('oCustomer').value);
      const productId = Number(document.getElementById('oProduct').value);
      const amount = Number(document.getElementById('oAmount').value || 0);
      const status = document.getElementById('oStatus').value;
      const date = document.getElementById('oDate').value || new Date().toISOString().slice(0, 10);

      const productQuery = db.exec('SELECT type, stock FROM products WHERE id = ' + productId);
      const product = productQuery[0]?.values?.[0] || [];
      const productType = product[0];
      const currentStock = product[1];
      if (productType === 'physical' && currentStock != null) {
        if (currentStock > 0) {
          db.run('UPDATE products SET stock = stock - 1 WHERE id = ?', [productId]);
        } else {
          alert('Sản phẩm vật lý đã hết hàng, không thể tạo đơn mới');
          return;
        }
      }

      db.run('INSERT INTO orders (customer_id, product_id, amount, status, purchased_at) VALUES (?, ?, ?, ?, ?)', [customerId, productId, amount, status, date]);
      persistDb();
      renderAll();
      document.getElementById('oAmount').value = '';
    }

    function deleteProduct(id) {
      db.run('DELETE FROM products WHERE id = ?', [id]);
      persistDb();
      renderAll();
    }

    function deleteCustomer(id) {
      db.run('DELETE FROM customers WHERE id = ?', [id]);
      persistDb();
      renderAll();
    }

    function deleteOrder(id) {
      db.run('DELETE FROM orders WHERE id = ?', [id]);
      persistDb();
      renderAll();
    }

    function renderAll() {
      renderProducts();
      renderCustomers();
      renderOrders();
    }

    async function initAdmin() {
      SQL = await initSqlJs({
        locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/${file}`
      });
      loadDb();
      ensureSchema();
      seedIfEmpty();
      persistDb();
      renderAll();
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('productsPanel').classList.toggle('hidden', tab.dataset.tab !== 'products');
        document.getElementById('customersPanel').classList.toggle('hidden', tab.dataset.tab !== 'customers');
        document.getElementById('ordersPanel').classList.toggle('hidden', tab.dataset.tab !== 'orders');
      });
    });

    document.getElementById('oDate').value = new Date().toISOString().slice(0, 10);
    initAdmin();
  </script>
</body>
</html>
